[package]
name = "zyx-py"
version = "0.16.0"
edition = "2021"
license = "LGPL-3.0-only WITH Classpath-exception-2.0"
authors = ["zk4x"]
description = "Zyx Python bindings"
publish = false

[lib]
name = "zyx"
crate-type = ["cdylib"]

[dependencies]
zyx = { path = "../zyx", features = ["py"] }
zyx-optim = { path = "../zyx-optim", features = ["py"] }
zyx-nn = { path = "../zyx-nn", features = ["py"] }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
