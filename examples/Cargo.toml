[workspace]
resolver = "2"
members = [
    "mnist",
    "mnist-snn",
    "nanogpt",
    "phi",
    "readme-test",
    "rnn",
    "tiny-net",
    "tiny-net2",
    "llama",
    "qwen3.8-27b",
    "tt_gemm",
]

[profile.release]
opt-level = 1
strip = true
debug-assertions = false
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 16
debug = false

[profile.test]
opt-level = 1
