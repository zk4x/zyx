[package]
name = "zyx-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmarks for zyx ML library"
license = "LGPL-3.0-only WITH Classpath-exception-2.0"

[dependencies]
zyx = { path = "../zyx" }
nanoserde = { version = "0.2.1", default-features = false, features = ["binary"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Model definitions live outside the libraries (same split as tinygrad's
# `extra/models/llama.py`): benchmarks import them from the example crate.
llama = { path = "../examples/llama" }
