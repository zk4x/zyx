[package]
name = "zyx"
version = "0.17.0"
edition = "2024"
authors = ["zk4x"]
description = "Zyx machine learning library"
documentation = "https://docs.rs/zyx"
readme = "README.md"
homepage = "https://github.com/zk4x/zyx"
repository = "https://github.com/zk4x/zyx"
license = "LGPL-3.0-only WITH Classpath-exception-2.0"
keywords = ["tensor", "deep-learning", "neural-network", "autodiff"]
categories = ["computer-vision", "science"]
rust-version = "1.88.0"
include = [
    "src/**",
    "tests/01_unary.rs",
    "tests/02_binary.rs",
    "tests/03_movement.rs",
    "tests/04_reduce.rs",
    "tests/06_realize.rs",
    "tests/07_indexing.rs",
    "tests/08_graph.rs",
    "tests/09_graph.rs",
    "tests/10_bf16.rs",
    "tests/11_autograd.rs",
    "tests/12_llama_ops.rs",
    "tests/13_llama_pipeline.rs",
    "tests/14_bitcast.rs",
    "tests/16_quantization.rs",
    "tests/17_disk.rs",
    "tests/19_scalar_f8.rs",
    "tests/21_instr_sched.rs",
    "tests/22_rmsnorm_shapes.rs",
    "Cargo.toml",
    "README.md"
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
# Good, well written minimal dependencies
# libloading is used to access cuda, opencl and hsa runtimes
libloading = { version = "0.9.0", default-features = false, features = ["std"] } # ISC
# nanoserde is used to read backend config
nanoserde = { version = "0.2.1", default-features = false, features = ["std", "binary", "json"] }

# Lot of dependencies from wgpu, probably just don't use that
wgpu = { version = "29.0.1", default-features = false, features = ["vulkan", "metal", "dx12", "wgsl", "gles"], optional = true } # MIT or Apache 2.0
pollster = { version = "0.4.0", default-features = false, optional = true } # MIT or Apache 2.0

# Pyo3 is used only for python bindings
pyo3 = { version = "0.29.0", optional = true, features = ["extension-module", "generate-import-lib"] } # MIT or Apache 2.0

# tiny_http is used by the viz feature for the web server
tiny_http = { version = "0.12.0", optional = true } # MIT

# Tenstorrent. The device, kernel and simulator layers live in
# `src/backend/tenstorrent/` (ported from metalium-rs, see its `mod.rs`). Only
# the generated instruction tables and the simulator's boot images stay
# external: the tables are built from Tenstorrent's ISA specification and the
# images are RISC-V firmware.
tt-firmware-images = { path = "../firmware/tt-firmware-images" }
tt-isa = { path = "../../metalium-rs/crates/tt-isa" }

# `libc` for the simulator's fork isolation, `libm` for the SFPU op programs'
# host-side approximations.
libc = { version = "0.2.174", default-features = false }
libm = { version = "0.2.11", default-features = false }

[dev-dependencies]
matrixmultiply = "0.3"

[lib]
crate-type = ["lib"]

[features]
default = [
    #"viz",
    #"tenstorrent",
    #"wgpu",
    #"py",
    #"time",
    #"debug_tensor_op",
]

# Enables wgpu backend
wgpu = ["dep:wgpu", "dep:pollster"]

# Enables us to create python bindings with pyo3, annotates structs with pyclass
py = ["dep:pyo3"]

# Enables timing for optimization passes
time = []

# Enables debug println! at the start of every tensor op
debug_tensor_op = []

# Enables web-based kernel visualization server on port 4242
viz = ["dep:tiny_http"]

# Optimize for linking time, 'cause linker is so slow...
[profile.dev] # Modify profile settings via config.
opt-level = 0 # Optimization level.
debug = true  # Include debug info.
#split-debuginfo = '...'  # Debug info splitting behavior.
strip = false            # Removes symbols or debuginfo.
debug-assertions = true  # Enables debug assertions.
overflow-checks = true   # Enables runtime integer overflow checks.
lto = false              # Sets link-time optimization.
panic = 'unwind'         # The panic strategy.
incremental = true       # Incremental compilation.
codegen-units = 16       # Parallelize LLVM codegen for faster debug builds.
#rpath = false           # Sets the rpath linking option.

[profile.test]
opt-level = 1
debug = true
strip = false
debug-assertions = true
overflow-checks = true
lto = false
incremental = true
codegen-units = 16

[profile.release]
opt-level = 3            # Also "z" is quite fine
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
debug = 0
